<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <title>Login | AuthFlow</title>
</head>
<body>

    <header>
        <h1>AuthFlow</h1>
        <h2>Sistema de Gerenciamento de Usuários</h2>
    </header>

    <main>
        <section class="auth-card">
            <h2>Acesse sua Conta</h2>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="lembrar" name="lembrar">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="/forgot-password" class="btn-link">Esqueci minha senha</a>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="auth-footer">
                <p>Ainda não possui uma conta?</p>
                <nav>
                    <a href="/register" class="btn-secondary">Criar Conta</a>
                </nav>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AuthFlow. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
